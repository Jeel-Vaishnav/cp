# Netlify Configuration for Campus Connect Frontend

[build]
  publish = "."

# Security and Cache Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache control for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# API Proxy:
# Note: Netlify CANNOT run PHP or MySQL natively.
# Once your PHP backend is deployed on Render/Railway/Fly.io/cPanel,
# replace YOUR_BACKEND_URL with your backend URL (e.g., https://campus-connect-api.onrender.com).
# This seamlessly proxies /api/* calls to your PHP server without CORS issues!
#
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR_BACKEND_URL/api/:splat"
#   status = 200
#   force = true
